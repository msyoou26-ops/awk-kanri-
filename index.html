<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040810">
<title>AWK v5</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#040810;--bg2:#060c18;
  --navy:#0a1628;--navy2:#0f2044;--navy3:#162850;
  --orange:#ff6b00;--orange2:#e85d04;--orange-l:rgba(255,107,0,.1);--orange-glow:rgba(255,107,0,.3);
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.03);--glass3:rgba(255,255,255,.07);
  --gb:rgba(68,136,255,.1);--gb2:rgba(68,136,255,.15);--ob:rgba(255,107,0,.2);
  --text:#e8f0ff;--text2:#9ab0cc;--dim:#506070;--muted:#2a3848;
  --green:#00d68f;--green-l:rgba(0,214,143,.1);
  --red:#ff3b3b;--red-l:rgba(255,59,59,.1);
  --amber:#ffb800;--amber-l:rgba(255,184,0,.1);
  --blue:#4488ff;--blue-l:rgba(68,136,255,.1);
  --surface:rgba(8,14,28,.8);--surface2:rgba(255,255,255,.03);
  --border:rgba(68,136,255,.1);--border2:rgba(68,136,255,.15);
  --safe-b:env(safe-area-inset-bottom,0px);
  --r:14px;--r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(255,107,0,.05) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 100% 100%,rgba(0,60,140,.12) 0%,transparent 60%),
  linear-gradient(180deg,#040810 0%,#060c18 100%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(68,136,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(68,136,255,.025) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;z-index:0;opacity:.7}
input,select,textarea,button{font-family:'Noto Sans JP',sans-serif}
.mi{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;user-select:none}
.mi.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.mi.sm{font-size:16px}.mi.md{font-size:20px}.mi.lg{font-size:28px}.mi.xl{font-size:36px}
/* LAYOUT */
.screen{display:none;min-height:100vh;flex-direction:column;padding-bottom:calc(64px + var(--safe-b));position:relative;z-index:1}
.screen.active{display:flex}
/* HEADER */
.hdr{background:rgba(4,8,16,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,107,0,.12);padding:0 16px;height:54px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(255,107,0,.06)}
.hdr-logo{font-family:'Inter',sans-serif;font-size:20px;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#ff6b00,#ffaa44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-title{font-size:14px;font-weight:600;color:var(--text);flex:1}
.hdr-sub{font-size:10px;color:var(--dim);flex:1}
.back-btn{background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:3px}
.hdr-btn{background:var(--glass);border:1px solid var(--gb2);color:var(--text2);padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
/* BOTTOM NAV */
.bnav-wrap{position:fixed;bottom:0;left:0;right:0;height:calc(64px + var(--safe-b));background:rgba(4,8,16,.96);backdrop-filter:blur(24px);border-top:1px solid rgba(255,107,0,.1);display:flex;z-index:50;padding-bottom:var(--safe-b)}
.bnav{flex:1;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;cursor:pointer;transition:all .2s;font-family:'Noto Sans JP',sans-serif;font-weight:500;padding:0;letter-spacing:.2px}
.bnav .mi{font-size:22px;transition:all .2s}
.bnav.on{color:var(--orange)}
.bnav.on .mi{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
/* APP BODY */
.app-body{flex:1;overflow-y:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch}
/* GLASS CARDS */
.card{background:rgba(6,12,24,.8);backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:0 4px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04)}
.card-sm{background:rgba(6,12,24,.7);border:1px solid var(--gb);border-radius:var(--r2);padding:12px;margin-bottom:8px}
.card-orange{background:rgba(255,107,0,.06);border:1px solid rgba(255,107,0,.2);border-radius:var(--r);padding:16px;margin-bottom:10px}
/* TAB BAR */
.tab-bar{background:rgba(4,8,16,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--gb);display:flex;flex-shrink:0;position:sticky;top:54px;z-index:40;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:none;border:none;color:var(--dim);padding:11px 16px;font-size:11px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;font-family:'Noto Sans JP',sans-serif}
.tab.on{color:var(--orange);border-bottom-color:var(--orange);font-weight:700}
/* BUTTONS */
.btn{background:var(--glass);border:1px solid var(--gb2);color:var(--text2);padding:10px 14px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#ff6b00,#ff9500);border:1px solid rgba(255,150,0,.3);color:#fff;padding:14px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(255,107,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:active{transform:scale(.97)}
.btn-navy{background:linear-gradient(135deg,var(--navy2),var(--navy3));border:1px solid var(--gb2);color:var(--text);padding:8px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-ghost{background:none;border:none;color:var(--dim);padding:5px 8px;border-radius:7px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:color .15s}
.btn-danger{background:var(--red-l);border:1px solid rgba(255,59,59,.2);color:var(--red);padding:9px 14px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer}
/* FORM */
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:600;color:rgba(255,107,0,.7);margin-bottom:5px;letter-spacing:.8px;text-transform:uppercase}
.f-input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--gb2);color:var(--text);padding:10px 12px;border-radius:9px;font-size:13px;outline:none;transition:border .2s;font-family:'Noto Sans JP',sans-serif}
.f-input:focus{border-color:rgba(255,107,0,.4);background:rgba(255,107,0,.04)}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--gb2);color:var(--text);padding:10px 12px;border-radius:9px;font-size:13px;outline:none;transition:border .2s;font-family:'Noto Sans JP',sans-serif}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(255,107,0,.4)}
.field select option{background:var(--navy2);color:var(--text)}
.field textarea{resize:none;min-height:60px}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:700;gap:3px}
.badge-orange{background:var(--orange-l);color:var(--orange)}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-amber{background:var(--amber-l);color:var(--amber)}
.badge-blue{background:var(--blue-l);color:var(--blue)}
.badge-navy{background:rgba(255,255,255,.07);color:var(--text2)}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:linear-gradient(160deg,var(--navy2),var(--navy));border:1px solid var(--gb2);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-hdr h2{font-size:15px;font-weight:700;color:var(--text)}
.modal-close{background:var(--glass);border:1px solid var(--gb2);color:var(--dim);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* PROGRESS */
.prog-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1)}
/* RING */
.ring-wrap{position:relative;flex-shrink:0}
/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(10,22,40,.96);backdrop-filter:blur(20px);color:#fff;border:1px solid var(--gb2);padding:10px 20px;border-radius:20px;font-size:12px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;max-width:88vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* CHIP */
.chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:16px;border:1px solid var(--gb2);background:var(--glass);cursor:pointer;font-size:11px;font-weight:500;color:var(--text2);gap:4px;transition:all .2s}
.chip.on{border-color:var(--ob);background:var(--orange-l);color:var(--orange)}
/* STAT CARD */
.stat-grid{display:grid;gap:8px;margin-bottom:10px}
.stat-grid-4{grid-template-columns:repeat(4,1fr)}
.stat-grid-3{grid-template-columns:repeat(3,1fr)}
.stat-grid-2{grid-template-columns:repeat(2,1fr)}
.stat-cell{background:rgba(255,255,255,.03);border:1px solid var(--gb);border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:var(--text);line-height:1}
.stat-lbl{font-size:8px;color:var(--dim);margin-top:4px;letter-spacing:.4px}
/* JOB CARD */
.job-card{background:rgba(6,12,24,.8);border:1px solid var(--gb);border-radius:var(--r);padding:14px;margin-bottom:8px;position:relative;overflow:hidden}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px}
.job-card.s-ongoing::before{background:linear-gradient(180deg,#ff6b00,#ff9500);box-shadow:0 0 10px rgba(255,107,0,.5)}
.job-card.s-kaiso_done::before{background:linear-gradient(180deg,#00d68f,#00b870);box-shadow:0 0 8px rgba(0,214,143,.4)}
.job-card.s-overdue::before{background:linear-gradient(180deg,#ff3b3b,#ff6666)}
.job-card.s-planned::before{background:var(--dim)}
/* LOSS CHIP */
.loss-chip{padding:6px 11px;border-radius:16px;border:1px solid var(--gb);background:var(--glass2);cursor:pointer;font-size:10px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:3px;transition:all .2s}
.loss-chip.on{border-color:rgba(255,59,59,.3);background:var(--red-l);color:var(--red)}
/* Z ROW */
.z-row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;border:1px solid var(--gb);background:var(--glass2);cursor:pointer;transition:all .2s;margin-bottom:5px}
.z-row.on{border-color:var(--ob);background:var(--orange-l)}
.z-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--gb2);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.z-row.on .z-check{background:var(--orange);border-color:var(--orange)}
.z-h{width:46px;text-align:center;font-size:13px;font-weight:700;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--gb2);border-radius:7px;padding:4px;outline:none;font-family:'Inter',sans-serif}
/* HOUR PICKER */
.h-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.h-btn{padding:9px 2px;border-radius:8px;border:1px solid var(--gb);background:var(--glass2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;font-family:'Inter',sans-serif}
.h-btn.on{border-color:var(--ob);background:var(--orange-l);color:var(--orange)}
.h-stepper{display:flex;align-items:center;gap:8px}
.h-step-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--gb2);background:var(--glass);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.h-step-btn:active{background:var(--orange-l);border-color:var(--ob)}
.h-val{flex:1;text-align:center;font-size:20px;font-weight:700;color:var(--text);background:var(--glass2);border:1px solid var(--gb2);border-radius:9px;padding:8px;outline:none;font-family:'Inter',sans-serif}
.h-val:focus{border-color:rgba(255,107,0,.4)}
/* INPUT PANEL */
.in-panel{background:rgba(6,12,24,.75);border:1px solid var(--gb);border-radius:var(--r2);padding:12px;margin-bottom:8px}
.in-panel-hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--navy2);border:1px solid var(--gb2);color:var(--text2);font-size:10px;font-weight:700;flex-shrink:0;font-family:'Inter',sans-serif}
.step-num.active{background:var(--orange);border-color:var(--orange);color:#fff}
/* STATUS FLOW */
.status-flow{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-bottom:10px}
.status-flow::-webkit-scrollbar{display:none}
.sf-step{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.sf-icon{width:26px;height:26px;border-radius:50%;background:var(--glass2);border:1.5px solid var(--gb);display:flex;align-items:center;justify-content:center;transition:all .3s}
.sf-icon.done{background:rgba(0,214,143,.15);border-color:var(--green)}
.sf-icon.active{background:rgba(255,107,0,.15);border-color:var(--orange);box-shadow:0 0 10px rgba(255,107,0,.3)}
.sf-lbl{font-size:7px;color:var(--dim);white-space:nowrap}
.sf-lbl.active{color:var(--orange);font-weight:700}
.sf-lbl.done{color:var(--green)}
.sf-conn{width:16px;height:1.5px;background:var(--gb);flex-shrink:0;margin-bottom:14px;transition:background .3s}
.sf-conn.done{background:var(--green)}
/* ALERT CARD */
.alert-card{border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.alert-red{background:rgba(255,59,59,.07);border:1px solid rgba(255,59,59,.18)}
.alert-amber{background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.18)}
.alert-orange{background:rgba(255,107,0,.07);border:1px solid rgba(255,107,0,.18)}
/* SCROLLBAR */
::-webkit-scrollbar{height:3px;width:3px}
::-webkit-scrollbar-thumb{background:rgba(68,136,255,.2);border-radius:3px}
/* TAG */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;background:var(--glass);border:1px solid var(--gb);color:var(--text2);margin:2px}
.tag button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0;display:flex}
/* TIMELINE */
.tl-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(68,136,255,.06)}
.tl-row:last-child{border-bottom:none}
/* LOGIN */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 18px;position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(68,136,255,.03) 39px,rgba(68,136,255,.03) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(68,136,255,.03) 39px,rgba(68,136,255,.03) 40px);pointer-events:none}
.login-box{background:rgba(5,9,18,.88);backdrop-filter:blur(40px);border:1px solid rgba(255,107,0,.18);border-radius:18px;padding:30px 22px;width:100%;max-width:340px;box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 50px rgba(255,107,0,.04),inset 0 1px 0 rgba(255,107,0,.08);position:relative;z-index:1}
.login-logo{font-family:'Inter',sans-serif;font-size:48px;font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#ff6b00,#ffaa44,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 18px rgba(255,107,0,.35));text-align:center;margin-bottom:3px}
.login-tag{font-size:9px;color:rgba(255,107,0,.55);letter-spacing:2px;text-align:center;margin-bottom:20px;text-transform:uppercase}
.login-tabs{display:flex;background:rgba(255,255,255,.03);border:1px solid var(--gb);border-radius:9px;padding:3px;margin-bottom:16px;gap:3px}
.ltab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;color:var(--dim);background:none;border:none;border-radius:7px;transition:all .2s;font-family:'Noto Sans JP',sans-serif}
.ltab.on{background:rgba(255,107,0,.18);color:var(--orange);font-weight:700;border:1px solid rgba(255,107,0,.25)}
.login-btn{background:linear-gradient(135deg,#ff6b00,#ff9500);color:#fff;border:1px solid rgba(255,150,0,.35);width:100%;padding:13px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 20px rgba(255,107,0,.3)}
.login-btn:active{transform:scale(.97)}
.login-err{color:var(--red);font-size:11px;margin-top:8px;text-align:center;min-height:16px}
/* WORKER HOME */
.wh-hero{background:rgba(5,10,20,.85);border:1px solid rgba(255,107,0,.15);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden}
.wh-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,107,0,.08) 0%,transparent 70%);pointer-events:none}
/* ACHIEVEMENT */
.achieve-bar{background:rgba(255,107,0,.06);border:1px solid rgba(255,107,0,.15);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px}
/* CONFIRM MODAL */
.confirm-modal{background:rgba(5,9,18,.96);border:1px solid var(--gb2);border-radius:16px;padding:22px 18px;max-width:320px;width:100%;text-align:center}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{animation:cardIn .25s ease both}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="screen active">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">AWK</div>
      <div class="login-tag">Factory OS v5 · 現場工数管理</div>
      <div style="font-size:9px;color:rgba(255,107,0,.5);letter-spacing:1px;display:flex;align-items:center;gap:5px;margin-bottom:16px"><span class="mi sm" style="font-size:11px">sensors</span>SYSTEM ONLINE</div>
      <div class="login-tabs">
        <button class="ltab on" id="ltab-boss" onclick="switchLoginTab('boss')">管理者</button>
        <button class="ltab" id="ltab-worker" onclick="switchLoginTab('worker')">作業者</button>

// Firebase
function initFirebase(){
  if(typeof firebase==="undefined"){fallback();return;}
  try{
    firebase.initializeApp(FC);db=firebase.database();fbReady=true;
    db.ref("jobs").on("value",s=>{jobs=s.val()||{};onDataChange();});
    db.ref("members").on("value",s=>{members=s.val()||{};onDataChange();});
    db.ref("nippoLogs").on("value",s=>{nippoLogs=s.val()||{};onDataChange();});
    db.ref("workLogs").on("value",s=>{workLogs=s.val()||{};onDataChange();});
    db.ref("qcLogs").on("value",s=>{qcLogs=s.val()||{};onDataChange();});
    db.ref("settings/templates").on("value",s=>{cloudTemplates=s.val()||{};});
    db.ref("settings/bossPassword").on("value",s=>{const v=s.val();if(v){cloudBossPass=v;bossPassword=v;}});
  }catch(e){fallback();}
}
function fallback(){
  try{jobs=JSON.parse(localStorage.getItem("awk_jobs")||"{}");}catch(e){jobs={};}
  try{members=JSON.parse(localStorage.getItem("awk_members")||"{}");}catch(e){members={};}
  try{nippoLogs=JSON.parse(localStorage.getItem("awk_nippo")||"{}");}catch(e){nippoLogs={};}
  try{workLogs=JSON.parse(localStorage.getItem("awk_logs")||"{}");}catch(e){workLogs={};}
  try{qcLogs=JSON.parse(localStorage.getItem("awk_qc")||"{}");}catch(e){qcLogs={};}
}
function saveLocal(){if(fbReady)return;localStorage.setItem("awk_jobs",JSON.stringify(jobs));localStorage.setItem("awk_members",JSON.stringify(members));localStorage.setItem("awk_nippo",JSON.stringify(nippoLogs));localStorage.setItem("awk_logs",JSON.stringify(workLogs));localStorage.setItem("awk_qc",JSON.stringify(qcLogs));}
async function dbSet(p,v){if(fbReady)await db.ref(p).set(v);else{setN(p,v);saveLocal();}}
async function dbPush(p,v){if(fbReady){const r=db.ref(p).push();await r.set(v);return r.key;}else{const k=uid();setN(p+"/"+k,v);saveLocal();return k;}}
async function dbRemove(p){if(fbReady)await db.ref(p).remove();else{rmN(p);saveLocal();}}
function setN(p,v){const k=p.split("/");const r=k[0];if(r==="jobs"){if(!jobs[k[1]])jobs[k[1]]={};if(k.length===2)jobs[k[1]]=v;else if(k.length===3)jobs[k[1]][k[2]]=v;else if(k.length===4){if(!jobs[k[1]][k[2]])jobs[k[1]][k[2]]={};jobs[k[1]][k[2]][k[3]]=v;}}else if(r==="members"&&k.length===2)members[k[1]]=v;else if(r==="nippoLogs"&&k.length===2)nippoLogs[k[1]]=v;else if(r==="workLogs"&&k.length===2)workLogs[k[1]]=v;else if(r==="qcLogs"&&k.length===2)qcLogs[k[1]]=v;}
function rmN(p){const k=p.split("/");if(k[0]==="jobs"&&k[1])delete jobs[k[1]];else if(k[0]==="members"&&k[1])delete members[k[1]];else if(k[0]==="nippoLogs"&&k[1])delete nippoLogs[k[1]];else if(k[0]==="workLogs"&&k[1])delete workLogs[k[1]];else if(k[0]==="qcLogs"&&k[1])delete qcLogs[k[1]];}

// Helpers
function jobsArr(){return Object.entries(jobs).map(([id,j])=>({...j,id}));}
function membersArr(){return Object.entries(members).map(([id,m])=>({...m,id}));}
function nippoArr(){return Object.entries(nippoLogs).map(([id,l])=>({...l,id})).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));}
function wlArr(){return Object.entries(workLogs).map(([id,l])=>({...l,id})).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));}
function getMember(id){return members[id]||null;}
function getJobsForMember(mid){return jobsArr().filter(j=>{const ids=(j.memberIds&&j.memberIds.length)?j.memberIds:[j.memberId].filter(Boolean);return ids.includes(mid);});}
function totalH(j){return parseFloat(j.planH)||0;}
// 個人の見積按分：主担当70%・電装担当30%・それ以外(サブ)は見積負担なし(0)。
// 主担当/電装が未設定の古い案件は今まで通り人数で均等按分するフォールバック
function memberEstimateShare(j,mid){
  const total=totalH(j);
  if(j.primaryMemberId||j.denkiMemberId){
    if(mid===j.primaryMemberId)return total*0.7;
    if(mid===j.denkiMemberId)return total*0.3;
    return 0;
  }
  const mids=(j.memberIds&&j.memberIds.length)?j.memberIds:[j.memberId].filter(Boolean);
  return total/Math.max(mids.length,1);
}
function actualH(j){let t=0;const mids=(j.memberIds&&j.memberIds.length)?j.memberIds:[j.memberId].filter(Boolean);mids.forEach(mid=>{((j.memberTasks&&j.memberTasks[mid])||[]).forEach(t2=>{t+=parseFloat(t2.actual)||0;});});return Math.round(t*100)/100;}
function lossH(j){let t=0;const mids=(j.memberIds&&j.memberIds.length)?j.memberIds:[j.memberId].filter(Boolean);mids.forEach(mid=>{((j.memberTasks&&j.memberTasks[mid])||[]).forEach(t2=>{t+=parseFloat(t2.lossH)||0;});});return Math.round(t*100)/100;}
function daysLeft(d){const t=new Date();t.setHours(0,0,0,0);return Math.ceil((new Date(d)-t)/86400000);}

function renderBossKPI(){
  const el=document.getElementById("homeKPI");if(!el)return;

  const otH=Math.round(logs.filter(l=>l.type==="overtime").reduce((a,l)=>a+(l.overtime||0),0)*100)/100;
  const items=[

function renderBossAlerts(){
  const el=document.getElementById("homeAlerts");if(!el)return;
  const active=jobsArr().filter(j=>j.status!=="kaiso_done");
  const ov=active.filter(j=>j.end&&daysLeft(j.end)<0);
  const near=active.filter(j=>j.end&&daysLeft(j.end)>=0&&daysLeft(j.end)<=3);
  const over=active.filter(j=>totalH(j)>0&&actualH(j)>totalH(j));
  const lhvy=active.filter(j=>lossH(j)>0).sort((a,b)=>lossH(b)-lossH(a)).slice(0,2);
  const alerts=[];
  if(ov.length)alerts.push({icon:"event_busy",c:"var(--red)",cls:"alert-red",t:`納期超過 ${ov.length}件`,items:ov.map(j=>`${esc(j.name)} ${j.end?Math.abs(daysLeft(j.end))+"日超":""}`)});

  if(over.length)alerts.push({icon:"trending_up",c:"var(--orange)",cls:"alert-orange",t:`工数超過 ${over.length}件`,items:over.map(j=>`${esc(j.name)} +${Math.round((actualH(j)-totalH(j))*100)/100}h`)});

let pendingDonutAnimations=[];
function runPendingDonutAnimations(){
  const batch=pendingDonutAnimations;pendingDonutAnimations=[];
  setTimeout(()=>{
    batch.forEach(({targets})=>{
      targets.forEach(({id,pct:p,c})=>{
        const el=document.getElementById(id),lb=document.getElementById(id+"_lbl");
        if(!el)return;
        const r=el.r?.baseVal?.value||22,circ=2*Math.PI*r;
        el.style.stroke=c;
        el.style.strokeDashoffset=circ-(circ*Math.min(p,100)/100);
        if(lb){let cur=0;const t=setInterval(()=>{cur=Math.min(cur+2,p);lb.textContent=cur+"%";if(cur>=p)clearInterval(t);},18);}
      });
    });
  },80);

function donutSVG(pct,color,size,id){

  return`<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">

      <circle fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
        cx="${size/2}" cy="${size/2}" r="${r}"
        id="${id}"
        style="stroke-dasharray:${circ};stroke-dashoffset:${circ};transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)"/>

    content.innerHTML=`

        const detail=l.type==="progress"?`${esc(l.jobName||"—")} · ${esc(l.taskName||"")}`:l.type==="indirect"?esc(IT.find(x=>x.key===l.indirectType)?.label||l.indirectType||""):l.type==="overtime"?"残業":esc(l.memo||"");

          <div style="flex:1;min-width:0">
            <span class="badge" style="background:${t.c}18;color:${t.c};font-size:8px;margin-bottom:2px">${t.l}</span>
            <div style="font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${detail}</div>
          </div>
          <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:${t.c};flex-shrink:0">${hrs||0}h</div>
        </div>`;
      }).join("")}`;
  }
  const diff=daysAgoJST(dateStr);
  const editBtn=diff<0?"":diff<=3?`<button class="btn-primary" style="width:100%;justify-content:center" onclick="openInputForDate('${dateStr}')"><span class="mi sm">edit</span>${diff===0?"今日の分を入力する":"この日の分を入力・修正する"}</button>`:`<div style="font-size:10px;color:var(--muted);text-align:center">3日より前の修正は管理者にご相談ください</div>`;

function workerJobCard(j){

      ${dl!==null?`<div class="stat-cell" style="padding:5px 4px"><div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:${dl<0?"var(--red)":dl<=3?"var(--amber)":"var(--text)"}">${dl<0?Math.abs(dl):dl}</div><div style="font-size:8px;color:var(--dim)">${dl<0?"日超":"日残"}</div></div>`:""}

  </div>`;
}
function renderWorkerJobDetail(){

  el.innerHTML=myJobs.map(j=>{
    const tp=totalH(j),ta=actualH(j),lh=lossH(j),pct=tp>0?Math.min(Math.round(ta/tp*100),100):0;
    const barC=pct>=100?"var(--red)":pct>=80?"var(--amber)":"var(--orange)";
    const tasks=((j.memberTasks&&j.memberTasks[mid])||[]);

    const flowHtml=`<div class="status-flow" style="margin-bottom:10px">${SF2W.map((s,i)=>{

      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">${esc(j.name)}</div><div style="font-size:10px;color:var(--dim);margin-top:2px">${esc(j.orderNo||"—")}${j.userName?" · "+esc(j.userName):""}${j.carType?" · "+esc(j.carType):""}</div></div>
        <span class="badge ${SB[j.status]||"badge-navy"}">${SL[j.status]||j.status}</span>
      </div>
      ${flowHtml}
      ${completeBtnHtml}
      ${mid===j.primaryMemberId?`<div class="card-sm" style="margin-bottom:10px;border-color:rgba(68,136,255,.25)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:11px;font-weight:700"><span class="mi sm" style="font-size:13px;vertical-align:-2px;color:var(--blue)">directions_car</span> 今日の架装進捗（車担当）</div><div style="font-size:13px;font-weight:800;color:var(--blue)" id="mpVal_${j.id}">${j.manualProgress?.pct??0}%</div></div>
        <input type="range" min="0" max="100" value="${j.manualProgress?.pct??0}" oninput="document.getElementById('mpVal_${j.id}').textContent=this.value+'%'" onchange="saveManualProgress('${j.id}',this.value)" style="width:100%">
        <div style="font-size:9px;color:var(--dim);margin-top:5px">${j.manualProgress?.updatedAt?`最終更新：${new Date(j.manualProgress.updatedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`:"まだ入力されていません。今日の進み具合を入れてください"}</div>
      </div>`:""}
      <div class="stat-grid stat-grid-4" style="margin-bottom:8px">
        <div class="stat-cell"><div class="stat-val" style="font-size:16px">${ta}h</div><div class="stat-lbl">実績</div></div>
        <div class="stat-cell"><div class="stat-val" style="font-size:16px;color:var(--dim)">${tp}h</div><div class="stat-lbl">見積</div></div>
        <div class="stat-cell" style="${tp>0&&ta>tp?"background:rgba(255,59,59,.06)":""}"><div class="stat-val" style="font-size:16px;color:${tp>0&&ta>tp?"var(--red)":"var(--green)"}">${tp>0?Math.abs(Math.round((tp-ta)*100)/100):"-"}h</div><div class="stat-lbl">${tp>0&&ta>tp?"超過":"残り"}</div></div>

      </div>
      ${tp>0?`<div class="prog-bar" style="margin-bottom:3px"><div style="height:100%;width:${pct}%;background:${barC};transition:width 1s cubic-bezier(.4,0,.2,1)"></div></div><div style="text-align:right;font-size:9px;color:${barC};margin-bottom:8px">${pct}%</div>`:""}
      ${tasks.length?`<div style="font-size:9px;font-weight:700;color:var(--dim);margin-bottom:6px;letter-spacing:.8px">工程別</div>${tasks.map(t=>{const a=parseFloat(t.actual)||0;const lH=parseFloat(t.lossH)||0;return`<div style="display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid rgba(68,136,255,.06)"><div style="width:6px;height:6px;border-radius:50%;background:${t.status==="done"?"var(--green)":t.status==="ongoing"?"var(--amber)":"var(--muted)"};flex-shrink:0"></div><div style="flex:1;font-size:11px;color:var(--text2)">${esc(t.name||"作業")}</div><span style="font-size:11px;font-weight:700;font-family:'Inter',sans-serif">${a}h</span>${lH>0?`<span class="badge badge-red" style="font-size:8px">${lH}h</span>`:""}</div>`;}).join("")}`:""}
    </div>`;
  }).join("");
}

async function editNippoLog(id){
  const log=nippoLogs[id];if(!log)return;
  const cur=log.type==="overtime"?(log.overtime||0):(log.hours||0);
  const input=prompt("修正後の時間(h)を入力してください",cur);
  if(input===null)return;
  const nv=parseFloat(input);
  if(isNaN(nv)||nv<0){showToast("正しい数値を入力してください");return;}
  const diff=Math.round((nv-cur)*100)/100;
  if(diff===0)return;
  if(log.type==="progress"&&log.jobId&&log.taskName){
    const j=jobs[log.jobId];
    if(j){
      const mt=(j.memberTasks&&j.memberTasks[log.memberId])||[];
      const upd=mt.map(t=>t.name!==log.taskName?t:{...t,actual:Math.max(0,Math.round(((parseFloat(t.actual)||0)+diff)*100)/100)});
      await dbSet(`jobs/${log.jobId}/memberTasks/${log.memberId}`,upd);
      if(!j.memberTasks)j.memberTasks={};
      j.memberTasks[log.memberId]=upd;
    }
    await dbSet(`nippoLogs/${id}/hours`,nv);
    nippoLogs[id]={...nippoLogs[id],hours:nv};
  }else if(log.type==="indirect"){
    await dbSet(`nippoLogs/${id}/hours`,nv);
    nippoLogs[id]={...nippoLogs[id],hours:nv};
  }else if(log.type==="overtime"){
    await dbSet(`nippoLogs/${id}/overtime`,nv);
    nippoLogs[id]={...nippoLogs[id],overtime:nv};
  }
  onDataChange();
  showToast("✅ 修正しました");
}
async function deleteNippoLog(id){
  confirmAction("この記録を削除しますか？","削除後に正しい内容で再入力してください。",async()=>{
    const log=nippoLogs[id];
    if(log&&log.type==="progress"&&log.jobId&&log.taskName){
      const mid2=log.memberId;const j=jobs[log.jobId];
      if(j&&mid2){
        const mt=(j.memberTasks&&j.memberTasks[mid2])||[];
        const upd=mt.map(t=>{if(t.name!==log.taskName)return t;return{...t,actual:Math.max(0,Math.round(((parseFloat(t.actual)||0)-(log.hours||0))*100)/100),lossH:log.loss?Math.max(0,Math.round(((parseFloat(t.lossH)||0)-(log.hours||0))*100)/100):parseFloat(t.lossH)||0};});
        await dbSet(`jobs/${log.jobId}/memberTasks/${mid2}`,upd);
        if(!fbReady){if(!j.memberTasks)j.memberTasks={};j.memberTasks[mid2]=upd;}
      }
    }
    await dbRemove("nippoLogs/"+id);
    if(!fbReady)delete nippoLogs[id];
    showToast("✅ 削除しました");
    onDataChange();
    if(isBoss())renderBossInputHistory();else renderWorkerHistory();
  });
}

function populateTplSelect(selId,tplKey,curVal){
  const sel=document.getElementById(selId);const tpls=getTpls(tplKey);
  sel.innerHTML="<option value=''>選択</option>"+tpls.map(t=>`<option value="${t}"${t===curVal?" selected":""}>${esc(t)}</option>`).join("")+"<option value='__manual__'>その他...</option>";
  const manual=document.getElementById(selId+"Manual");

function toggleManual(selId,manualId){const sel=document.getElementById(selId);const m=document.getElementById(manualId);if(m)m.style.display=sel.value==="__manual__"?"block":"none";}
async function saveJob(){
  const name=document.getElementById("fName").value==="__manual__"?document.getElementById("fNameManual").value.trim():document.getElementById("fName").value;
  const carType=document.getElementById("fCar").value==="__manual__"?document.getElementById("fCarManual").value.trim():document.getElementById("fCar").value;
  if(!name){showToast("案件名を入力してください");return;}
  let memberIds=[...document.querySelectorAll("#fMemberChips .chip.on")].map(el=>el.id.replace("jmc_",""));
  const primaryMemberId=document.getElementById("fPrimary").value||null;
  const denkiMemberId=document.getElementById("fDenki").value||null;
  // 主担当・電装担当に選んだ人は担当者リストにも自動で含める
  [primaryMemberId,denkiMemberId].forEach(id=>{if(id&&!memberIds.includes(id))memberIds.push(id);});
  const data={name,orderNo:document.getElementById("fOrd").value.trim(),carType,userName:document.getElementById("fUser").value.trim(),start:document.getElementById("fStart").value,end:document.getElementById("fEnd").value,planH:parseFloat(document.getElementById("fPlan").value)||0,memberIds,primaryMemberId,denkiMemberId,status:editJobId?jobs[editJobId]?.status:"ongoing",updatedAt:Date.now()};
  const id=editJobId||uid();
  await dbSet("jobs/"+id,{...(editJobId?jobs[editJobId]:{}), ...data});
  if(!fbReady)jobs[id]={...data,id};
  closeModal("jobModal");showToast(editJobId?"✅ 更新しました":"✅ 案件を追加しました");if(!fbReady)onDataChange();
}
async function advanceJobStatus(jid){
  const j=jobs[jid];if(!j)return;
  const curIdx=SF.indexOf(j.status||"planned");
  if(curIdx<0||curIdx>=SF.length-1)return;
  const next=SF[curIdx+1];
  await dbSet(`jobs/${jid}/status`,next);
  // fbReady・非fbReady両方でローカルを即更新して画面反映
  jobs[jid]={...jobs[jid],status:next};
  onDataChange();
  if(next==="kaiso_done")showCompletionOverlay(j.name);
  else showToast(`→ ${SL[next]} に更新しました`);
}
function showCompletionOverlay(name,opts){
  const o=opts||{};
  const sub=o.sub||"架装完了しました";
  showToast(`✅ ${name}：${sub}`);
  onDataChange();
}
async function markJobDone(jid){await advanceJobStatus(jid);}
// ===== 作業者：架装完了ボタン =====
async function workerCompleteJob(jid){
  const j=jobs[jid];if(!j)return;
  const status=j.status||"planned";
  const mid=session.memberId;
  const tasks=(j.memberTasks&&j.memberTasks[mid])||[];
  if(!tasks.length||!tasks.every(t=>t.status==="done")){showToast("工程を全て完了にしてから押してください");return;}
  if(!WORKER_EDITABLE_STATUSES.includes(status)){showToast("この案件はすでに架装完了しています");return;}
  confirmAction("架装完了にしますか？","この案件の作業はこれで完了になります。",async()=>{
    await dbSet(`jobs/${jid}/status`,"kaiso_done");
    jobs[jid]={...jobs[jid],status:"kaiso_done"};
    onDataChange();
    showCompletionOverlay(j.name,{eyebrow:"KAISO COMPLETE",sub:"架装完了 — お疲れさまでした",icon:"check_circle"});
  },"架装完了にする",false);
}
async function jumpJobStatus(jid,targetStatus){
  const j=jobs[jid];if(!j)return;
  if((j.status||"planned")===targetStatus)return;
  await dbSet(`jobs/${jid}/status`,targetStatus);
  jobs[jid]={...jobs[jid],status:targetStatus};
  onDataChange();
  if(document.getElementById("jobDetailModal")?.classList.contains("open"))openJobDetail(jid);
  if(targetStatus==="kaiso_done")showCompletionOverlay(j.name);
  else showToast(`→ ${SL[targetStatus]} に更新しました`);
}
async function revertJobStatus(jid){
  const j=jobs[jid];if(!j)return;
  const curIdx=SF.indexOf(j.status||"planned");
  if(curIdx<=0)return;
  const prev=SF[curIdx-1];
  await dbSet(`jobs/${jid}/status`,prev);
  jobs[jid]={...jobs[jid],status:prev};
  onDataChange();
  showToast(`↩ ${SL[prev]} に戻しました`);
}
async function undoJobDone(jid){
  await dbSet(`jobs/${jid}/status`,"ongoing");
  jobs[jid]={...jobs[jid],status:"ongoing"};
  // フィルターを「進行中」に切り替えて取り消した案件が見えるようにする
  jobFilter="ongoing";
  document.querySelectorAll(".chip[id^='jf-']").forEach(c=>c.classList.remove("on"));
  const ongoing=document.getElementById("jf-ongoing");if(ongoing)ongoing.classList.add("on");
  onDataChange();
  showToast("↩ 施工中に戻しました");
}
async function deleteJob(jid){confirmAction("案件を削除しますか？","この操作は元に戻せません。",async()=>{await dbRemove("jobs/"+jid);if(!fbReady){delete jobs[jid];onDataChange();}showToast("削除しました");});}

}
async function saveMember(){
  const name=document.getElementById("mName").value.trim();if(!name){showToast("氏名を入力してください");return;}
  const id=editMemberId||uid();await dbSet("members/"+id,{name,role:document.getElementById("mRole").value.trim(),updatedAt:Date.now()});
  if(!fbReady)members[id]={name,role:document.getElementById("mRole").value.trim()};
  closeModal("memberModal");showToast(editMemberId?"✅ 更新しました":"✅ 追加しました");if(!fbReady)onDataChange();
}
async function deleteMember(mid){confirmAction("作業者を削除しますか？","この操作は元に戻せません。",async()=>{await dbRemove("members/"+mid);if(!fbReady){delete members[mid];onDataChange();}showToast("削除しました");});}

// ===== 設定 =====
function renderSettings(){
  ["jobName","carType","taskTpl"].forEach(key=>{const el=document.getElementById(key+"List");if(!el)return;const tpls=getTpls(key);el.innerHTML=tpls.map(t=>`<span class="tag">${esc(t)}<button onclick="removeTemplate('${key}','${t}')"><span class="mi sm">close</span></button></span>`).join("")||`<span style="font-size:11px;color:var(--muted)">まだありません</span>`;});
}
async function addTemplate(key){const el=document.getElementById(key+"Input");if(!el)return;const v=el.value.trim();if(!v)return;const tpls=getTpls(key);if(tpls.includes(v)){showToast("すでに登録されています");return;}tpls.push(v);const obj={};tpls.forEach((t,i)=>{obj[i]=t;});await dbSet("settings/templates/"+key,obj);if(!fbReady){if(!cloudTemplates[key])cloudTemplates[key]={};cloudTemplates[key][Object.keys(cloudTemplates[key]||{}).length]=v;}el.value="";renderSettings();showToast("✅ 追加しました");}
async function removeTemplate(key,val){const tpls=getTpls(key).filter(t=>t!==val);const obj={};tpls.forEach((t,i)=>{obj[i]=t;});await dbSet("settings/templates/"+key,obj);if(!fbReady)cloudTemplates[key]=obj;renderSettings();}
function changePassword(){const np=document.getElementById("newPass").value.trim();if(!np)return;bossPassword=np;localStorage.setItem("awk_boss_pass",np);if(fbReady)db.ref("settings/bossPassword").set(np);document.getElementById("newPass").value="";showToast("✅ パスワードを変更しました");}

// ===== 確認モーダル =====
function confirmAction(title,msg,cb,okLabel,okDanger){
  document.getElementById("confirmTitle").textContent=title;document.getElementById("confirmMsg").textContent=msg;
  const okBtn=document.getElementById("confirmOkBtn");
  okBtn.textContent=okLabel||"削除する";
  okBtn.className=(okDanger===false)?"btn-primary":"btn-danger";
  okBtn.style.flex="1";
  okBtn.onclick=()=>{closeModal("confirmModal");cb();};
  openModal("confirmModal");
  document.getElementById("confirmModal").onclick=e=>{if(e.target===document.getElementById("confirmModal"))closeModal("confirmModal");};
}

initFirebase();
</script>
